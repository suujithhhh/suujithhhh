<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Sujith Kumar — Robotics Software and Embedded Systems">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#16222e" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f16"/>
      <stop offset="1" stop-color="#0d1a24"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animate attributeName="x1" values="0;-1;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="lidar" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="scale(70)">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="arenaClip"><rect x="560" y="44" width="410" height="250" rx="6"/></clipPath>
    <path id="route" d="M590 270 C590 190 655 205 655 142 C655 112 835 172 835 132 C835 102 800 207 845 207 C868 207 860 168 705 150 C640 142 590 175 590 270"/>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .boot { opacity: 0; animation: in .4s ease-out forwards; }
    .b1 { animation-delay: .4s } .b2 { animation-delay: .9s } .b3 { animation-delay: 1.4s }
    .b4 { animation-delay: 1.9s } .b5 { animation-delay: 2.4s } .b6 { animation-delay: 2.9s }
    @keyframes in { from { opacity: 0; transform: translateX(-6px) } to { opacity: 1; transform: none } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .obst { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 50% { stroke-opacity: .35 } }
    .led { animation: blink 0.8s steps(1) infinite; }
  </style>

  <!-- window -->
  <rect width="1000" height="320" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="320" rx="14" fill="url(#grid)" opacity=".8"/>
  <rect x=".5" y=".5" width="999" height="319" rx="14" fill="none" stroke="#1f3b4d"/>
  <circle cx="24" cy="20" r="5.5" fill="#ff5f57"/>
  <circle cx="42" cy="20" r="5.5" fill="#febc2e"/>
  <circle cx="60" cy="20" r="5.5" fill="#28c840"/>
  <text x="500" y="24" text-anchor="middle" class="mono" font-size="12" fill="#5b7083">suujithhhh@robot: ~/mission_control</text>

  <!-- left: identity + boot log -->
  <g class="mono">
    <text x="40" y="72" font-size="14" fill="#22d3ee">&gt; whoami</text>
    <text x="40" y="122" font-size="46" font-weight="800" fill="url(#nameGrad)" letter-spacing="2">SUJITH KUMAR</text>
    <text x="40" y="150" font-size="14.5" fill="#8b9eb0">Robotics Software · Embedded Systems · Control</text>

    <g font-size="12.5">
      <text x="40" y="186" class="boot b1"><tspan fill="#34d399">[  OK  ]</tspan><tspan fill="#c9d6e2"> FreeRTOS scheduler running</tspan></text>
      <text x="40" y="206" class="boot b2"><tspan fill="#34d399">[  OK  ]</tspan><tspan fill="#c9d6e2"> UART link up · ACK/ERR protocol</tspan></text>
      <text x="40" y="226" class="boot b3"><tspan fill="#34d399">[  OK  ]</tspan><tspan fill="#c9d6e2"> CAN 2.0A bus · ERROR_ACTIVE</tspan></text>
      <text x="40" y="246" class="boot b4"><tspan fill="#34d399">[  OK  ]</tspan><tspan fill="#c9d6e2"> PID heading hold · within ~1°</tspan></text>
      <text x="40" y="266" class="boot b5"><tspan fill="#fbbf24">[ INFO ]</tspan><tspan fill="#c9d6e2"> NTU MDP · 1st of 32 teams</tspan></text>
      <text x="40" y="292" class="boot b6"><tspan fill="#22d3ee">$</tspan><tspan fill="#e6edf3"> ./mission --autonomous</tspan><tspan class="cursor" fill="#22d3ee"> █</tspan></text>
    </g>
  </g>

  <!-- right: arena -->
  <g>
    <rect x="560" y="44" width="410" height="250" rx="6" fill="#08131b" stroke="#1f3b4d"/>
    <text x="568" y="60" class="mono" font-size="10" fill="#3e5a6e">ARENA · 2.0m × 2.0m · state-lattice planner</text>
    <g clip-path="url(#arenaClip)">
      <!-- planned route (flowing dashes) -->
      <use href="#route" fill="none" stroke="#1d4e5f" stroke-width="1.5" stroke-dasharray="3 6">
        <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1s" repeatCount="indefinite"/>
      </use>
      <!-- trail that draws behind the robot -->
      <path d="M590 270 C590 190 655 205 655 142 C655 112 835 172 835 132 C835 102 800 207 845 207 C868 207 860 168 705 150 C640 142 590 175 590 270" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity=".7" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" from="1" to="0" dur="10s" repeatCount="indefinite"/>
      </path>

      <!-- obstacles with image faces -->
      <g fill="#0f2230" stroke="#f472b6" stroke-width="1.5">
        <rect class="obst" x="640" y="84" width="30" height="30" rx="2"/>
        <rect class="obst" x="820" y="74" width="30" height="30" rx="2" style="animation-delay:.6s"/>
        <rect class="obst" x="880" y="192" width="30" height="30" rx="2" style="animation-delay:1.2s"/>
        <rect class="obst" x="690" y="214" width="30" height="30" rx="2" style="animation-delay:1.8s"/>
      </g>
      <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
        <line x1="643" y1="114" x2="667" y2="114"/>
        <line x1="823" y1="104" x2="847" y2="104"/>
        <line x1="880" y1="195" x2="880" y2="219"/>
        <line x1="693" y1="214" x2="717" y2="214"/>
      </g>
      <g class="mono" font-size="9" fill="#f9a8d4" text-anchor="middle">
        <text x="655" y="103">11</text><text x="835" y="93">24</text>
        <text x="895" y="211">37</text><text x="705" y="233">08</text>
      </g>

      <!-- robot -->
      <g>
        <animateMotion dur="10s" repeatCount="indefinite" rotate="auto">
          <mpath href="#route"/>
        </animateMotion>
        <g>
          <path d="M0 0 L66 -22 A70 70 0 0 1 66 22 Z" fill="url(#lidar)"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
        </g>
        <rect x="-11" y="-14" width="8" height="5" rx="1.5" fill="#94a3b8"/>
        <rect x="-11" y="9" width="8" height="5" rx="1.5" fill="#94a3b8"/>
        <rect x="5" y="-14" width="8" height="5" rx="1.5" fill="#94a3b8"/>
        <rect x="5" y="9" width="8" height="5" rx="1.5" fill="#94a3b8"/>
        <rect x="-14" y="-10" width="30" height="20" rx="4" fill="#12324a" stroke="#22d3ee" stroke-width="1.5"/>
        <path d="M6 -5 L14 0 L6 5 Z" fill="#22d3ee"/>
        <circle cx="-6" cy="0" r="2.2" fill="#34d399" class="led"/>
      </g>
    </g>
    <text x="962" y="286" text-anchor="end" class="mono" font-size="10" fill="#3e5a6e">STM32F407 · FreeRTOS · C/C++</text>
  </g>
</svg>
