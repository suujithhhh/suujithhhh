<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Animated telemetry: PID step response, UART/CAN frame log, CAN bus waveform">
  <defs>
    <pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#14202b" stroke-width="1"/>
    </pattern>
    <clipPath id="c1"><rect x="10" y="10" width="320" height="220" rx="10"/></clipPath>
    <clipPath id="c2"><rect x="340" y="46" width="320" height="178"/></clipPath>
    <clipPath id="c3"><rect x="680" y="40" width="300" height="185"/></clipPath>
    <path id="resp" d="M30 200 L52 200 C82 200 86 76 112 78 C132 80 137 114 158 109 C178 104 182 98 204 100 L318 100"/>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .late { animation: late 5s linear infinite; }
    @keyframes late { 0%,55% { opacity: 0 } 62%,95% { opacity: 1 } 100% { opacity: 0 } }
    .blink { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity: .25 } }
  </style>

  <g class="mono">
  <!-- panel 1: PID step response -->
  <rect x="10" y="10" width="320" height="220" rx="10" fill="#0a1118" stroke="#1f3b4d"/>
  <rect x="10" y="10" width="320" height="220" rx="10" fill="url(#g)"/>
  <text x="24" y="32" font-size="11" fill="#8b9eb0">WHEEL PID · step response</text>
  <circle cx="314" cy="28" r="4" fill="#34d399" class="blink"/>
  <line x1="30" y1="100" x2="318" y2="100" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="316" y="93" font-size="9" fill="#fbbf24" text-anchor="end">setpoint</text>
  <line x1="30" y1="200" x2="318" y2="200" stroke="#2a3f50"/>
  <line x1="30" y1="50" x2="30" y2="200" stroke="#2a3f50"/>
  <use href="#resp" fill="none" stroke="#163444" stroke-width="2"/>
  <path d="M30 200 L52 200 C82 200 86 76 112 78 C132 80 137 114 158 109 C178 104 182 98 204 100 L318 100" fill="none" stroke="#22d3ee" stroke-width="2.2" pathLength="1" stroke-dasharray="1 1">
    <animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;0.6;1" dur="5s" repeatCount="indefinite"/>
  </path>
  <circle r="4" fill="#22d3ee">
    <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear"><mpath href="#resp"/></animateMotion>
  </circle>
  <g class="late" font-size="9.5">
    <text x="116" y="68" fill="#f472b6">overshoot</text>
    <text x="220" y="122" fill="#34d399">settled · e(t) → 0</text>
  </g>
  <text x="24" y="220" font-size="9" fill="#3e5a6e">u(t) = Kp·e + Ki·∫e dt + Kd·de/dt</text>

