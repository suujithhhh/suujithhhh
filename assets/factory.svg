<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="Animated robot arm inspecting parts on a conveyor belt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f16"/>
      <stop offset="1" stop-color="#0d1a24"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity=".8"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <!-- boxes left of the arm are unchecked, boxes right of it are checked -->
    <clipPath id="before"><rect x="0" y="0" width="500" height="210"/></clipPath>
    <clipPath id="after"><rect x="500" y="0" width="500" height="210"/></clipPath>
    <g id="boxes">
      <rect x="-240" y="128" width="40" height="30" rx="3"/>
      <rect x="-80" y="128" width="40" height="30" rx="3"/>
      <rect x="80" y="128" width="40" height="30" rx="3"/>
      <rect x="240" y="128" width="40" height="30" rx="3"/>
      <rect x="400" y="128" width="40" height="30" rx="3"/>
      <rect x="560" y="128" width="40" height="30" rx="3"/>
      <rect x="720" y="128" width="40" height="30" rx="3"/>
      <rect x="880" y="128" width="40" height="30" rx="3"/>
    </g>
    <g id="roller">
      <circle r="9" fill="#111d27" stroke="#2a3f50" stroke-width="2"/>
      <path d="M-6 0H6M0 -6V6" stroke="#3e5a6e" stroke-width="2"/>
    </g>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .scan { animation: scan 3s ease-in-out infinite; }
    @keyframes scan { 0%,42% { opacity: 0 } 50% { opacity: 1 } 58%,100% { opacity: 0 } }
  </style>

  <rect width="1000" height="210" rx="14" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="999" height="209" rx="14" fill="none" stroke="#1f3b4d"/>

  <!-- gantry rail -->
  <rect x="380" y="14" width="240" height="8" rx="3" fill="#13212c" stroke="#2a3f50"/>
  <rect x="482" y="18" width="36" height="14" rx="3" fill="#12324a" stroke="#22d3ee"/>

  <!-- boxes on the belt -->
  <g>
    <g clip-path="url(#before)"><use href="#boxes" fill="#2b1a10" stroke="#fb923c" stroke-width="1.5"/></g>
    <g clip-path="url(#after)"><use href="#boxes" fill="#0f2a22" stroke="#34d399" stroke-width="1.5"/></g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="160 0" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- belt -->
  <rect x="30" y="158" width="940" height="22" rx="11" fill="#0c151d" stroke="#2a3f50" stroke-width="1.5"/>
  <line x1="42" y1="159" x2="958" y2="159" stroke="#3e5a6e" stroke-width="2" stroke-dasharray="10 14">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.45s" repeatCount="indefinite"/>
  </line>
  <g>
    <g transform="translate(60 169)"><use href="#roller"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/></use></g>
    <g transform="translate(220 169)"><use href="#roller"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/></use></g>
    <g transform="translate(380 169)"><use href="#roller"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/></use></g>
    <g transform="translate(620 169)"><use href="#roller"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/></use></g>
    <g transform="translate(780 169)"><use href="#roller"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/></use></g>
    <g transform="translate(940 169)"><use href="#roller"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/></use></g>
  </g>

  <!-- 2-link arm: shoulder at (500,30); dips straight down when a part is centred under it -->
  <g transform="translate(500 30)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-28;-28;0;0;-28" keyTimes="0;0.3;0.45;0.55;1" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1"/>
      <rect x="-5" y="0" width="10" height="46" rx="5" fill="#12324a" stroke="#22d3ee" stroke-width="1.5"/>
      <circle r="7" fill="#0a1118" stroke="#22d3ee" stroke-width="2"/>
      <g transform="translate(0 46)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="56;56;0;0;56" keyTimes="0;0.3;0.45;0.55;1" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1"/>
          <rect x="-4" y="0" width="8" height="40" rx="4" fill="#12324a" stroke="#22d3ee" stroke-width="1.5"/>
          <circle r="5.5" fill="#0a1118" stroke="#22d3ee" stroke-width="2"/>
          <!-- end effector / inspection head -->
          <g transform="translate(0 40)">
            <rect x="-9" y="0" width="18" height="7" rx="2" fill="#1b2b3a" stroke="#34d399" stroke-width="1.5"/>
            <path class="scan" d="M-7 7 L-16 40 L16 40 L7 7 Z" fill="url(#beam)"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <g class="mono">
    <text x="520" y="70" font-size="11" fill="#34d399" class="scan">PASS ✓</text>
    <text x="40" y="40" font-size="11" fill="#8b9eb0">pick · inspect · place</text>
    <text x="40" y="58" font-size="9.5" fill="#3e5a6e">firmware → control → autonomy</text>
    <text x="960" y="40" font-size="10" fill="#3e5a6e" text-anchor="end">cell_01 · cycle 3.0 s</text>
    <text x="500" y="200" font-size="10" fill="#3e5a6e" text-anchor="middle">thanks for stopping by · built with C++, coffee and too many encoder ticks</text>
  </g>
</svg>
